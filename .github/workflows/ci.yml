name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Extractor and build tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: scripts
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: node tests/page-data.mjs
      - run: node tests/radio.mjs
      - run: node tests/players-client.mjs
      - run: node tests/workers.mjs
      - run: node --test tests/performance-metrics.test.mjs

  browser:
    name: native Chromium smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Build root and GitHub Pages subpath
        run: |
          python scripts/build.py --out dist-browser-root
          python scripts/build.py --out dist-browser-pages --base-path /neonauts/
          python scripts/build.py --out dist-browser-immutable
          python scripts/prepare_neocities_release.py --directory dist-browser-immutable
          python scripts/check.py --directory dist-browser-immutable
      - name: Browser smoke (desktop and mobile viewport)
        run: node tests/browser-smoke.mjs
      - name: Five cold-load lab samples per scenario
        run: node tests/performance.mjs
      - name: Attach reproducible performance measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cold-load-performance
          path: tests/artifacts/performance/
          if-no-files-found: error
      - name: Verify hexagon portraits are actually visible
        run: python tests/check_roster_render.py
      - name: Attach roster sprite visual review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roster-sprite-native-previews
          path: tests/artifacts/roster-sprite-*.png
          if-no-files-found: error
      - name: Attach failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-failure
          path: tests/artifacts/
          if-no-files-found: ignore
