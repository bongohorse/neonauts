name: Deploy to Neocities
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neocities-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: scripts
      - run: node tests/players-client.mjs
      - run: node tests/workers.mjs
      - run: python scripts/build.py
      - run: python scripts/fetch_players.py
      - run: node tests/page-data.mjs
      - run: python scripts/deploy_neocities.py
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
