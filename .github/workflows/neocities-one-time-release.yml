name: One-time Neocities publication (11 Oct 2026)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/neocities-one-time-release.yml

permissions:
  contents: read

concurrency:
  group: neocities-production
  cancel-in-progress: false

jobs:
  publish:
    # A single explicit authorization commit. Other pushes cannot invoke this job.
    if: >-
      github.event.head_commit.message == 'ops: authorized one-time Neocities upload 2026-10-11'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Python validation
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: scripts
      - run: python scripts/build.py
      - name: Preserve recorded player-history snapshots
        run: >-
          python scripts/fetch_players.py
          --history-url https://awesomenauts.neocities.org/players.json
          --history-url https://bongohorse.github.io/neonauts/players.json
      - run: python scripts/check.py
      - run: node tests/page-data.mjs
      - run: node tests/radio.mjs
      - run: node tests/players-client.mjs
      - run: node tests/workers.mjs
      - name: Prepare immutable release assets
        run: python scripts/prepare_neocities_release.py
      - name: Verify all built release files
        run: python scripts/check.py
      - name: Archive entrypoint HTML for manual recovery
        shell: bash
        run: |
          mkdir -p release-entrypoints
          cp dist/index.html dist/not_found.html release-entrypoints/
          cp -R dist/nauts release-entrypoints/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neocities-release-entrypoints
          path: release-entrypoints
          retention-days: 30
      - name: Authenticated read-only deployment preflight
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: python scripts/deploy_neocities.py --dry-run --require-immutable
      - name: Publish only changed files to verified Neocities site
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: python scripts/deploy_neocities.py --require-immutable
